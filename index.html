<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

        <title>Frontend Mentor | Interactive rating component</title>

        <link rel="stylesheet" href="./src/css/reset.css" />
        <link rel="stylesheet" href="./src/css/variables.css" />
        <link rel="stylesheet" href="./src/css/style.css" />
        <link rel="stylesheet" href="./src/css/responsive.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <!-- Rating state start -->

        <main class="container">
            <section id="rating-card" class="rating-card ">
                <div class="rating-card__icon">
                    <img src="./assets/images/icon-star.svg" alt="Star icon" class="rating-card__star" />
                </div>
                <div class="rating-card__content">
                    <h1 class="rating-card__title">How did we do?</h1>
                    <p class="rating-card__description">
                        Please let us know how we did with your support request. All feedback is appreciated to help us
                        improve our offering!
                    </p>
                    <ul class="rating-card__list">
                        <li class="rating-card__item">
                            <button type="button" data-rating="1" class="rating-card__button">1</button>
                        </li>
                        <li class="rating-card__item">
                            <button type="button" data-rating="2" class="rating-card__button">2</button>
                        </li>
                        <li class="rating-card__item">
                            <button type="button" data-rating="3" class="rating-card__button">3</button>
                        </li>
                        <li class="rating-card__item">
                            <button type="button" data-rating="4" class="rating-card__button">4</button>
                        </li>
                        <li class="rating-card__item">
                            <button type="button" data-rating="5" class="rating-card__button selected">5</button>
                        </li>
                    </ul>
                </div>
                <button type="button" id="submit-rating" class="rating-card__submit">Submit</button>
            </section>

            <section id="thank-you-card" class="rating-card rating-card--thank-you hidden">
                <img
                    src="./assets/images/illustration-thank-you.svg"
                    alt="Thank you illustration"
                    class="rating-card__illustration"
                />

                <p class="rating-card__selected-rating">You selected <span id="selected-rating">1</span> out of 5</p>
                <div class="rating-card__content">
                    <h1 class="rating-card__title">Thank you!</h1>
                    <p class="rating-card__description">
                        We appreciate you taking the time to give a rating. If you ever need more support, don’t
                        hesitate to get in touch!
                    </p>
                </div>
            </section>
        </main>
    </body>
</html>
